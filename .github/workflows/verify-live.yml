name: verify-live
# Every hour (and on demand): rebuild the public files from this commit and compare them byte for byte with what the
# live site serves (scripts/verify-live.js). Read-only; no secrets; actions pinned by commit.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
      - run: node scripts/verify-live.js
